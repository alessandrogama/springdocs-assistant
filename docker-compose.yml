services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: springdocs-qdrant
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springdocs-api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - COLLECTION_NAME=spring_docs_v3_4
      - SPRING_VERSION=3.4
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - LLM_MODEL=qwen2.5:3b
      - TOP_K=5
      - SCORE_THRESHOLD=0.35
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
    name: springdocs_qdrant_storage
