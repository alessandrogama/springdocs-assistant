name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci-test-and-coverage:
    name: Lint, Test & Coverage (>=80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Linter (Ruff)
        run: |
          uv run ruff check src/ tests/

      - name: Run Tests with Coverage Enforcement (fail_under=80%)
        run: |
          uv run pytest --cov=src --cov-report=term-missing --cov-report=markdown:coverage.md --cov-fail-under=80

      - name: Publish Coverage Report to Step Summary
        if: always()
        run: |
          if [ -f coverage.md ]; then
            echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            cat coverage.md >> $GITHUB_STEP_SUMMARY
          fi

  cd-docker-release:
    name: Build & Push Docker Image to GHCR
    needs: ci-test-and-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
